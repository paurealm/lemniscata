name: Deploy lemniscata.net

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-24.04

    steps:
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.COMMANDCORE_HOST }}
          username: 'redstone'
          key: ${{ secrets.COMMANDCORE_SSH_KEY }}
          port: 22
          script: |
            cd /var/www/lemniscata/core/
            git reset --hard
            git pull origin main
            cd /var/www/lemniscata/core/backend/
            pnpm install
            sudo systemctl restart lemniscata.webapi
            cd /var/www/lemniscata/core/cartago/
            pnpm install
            sudo systemctl restart lemniscata.cartago