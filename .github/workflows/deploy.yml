name: Deploy lemniscata.net

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: NX1X/cloudflare-tunnel-ssh-action@v1
        with: 
          cf-access-client-id:     ${{ secrets.CF_ACCESS_CLIENT_ID }}
          cf-access-client-secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          ssh-private-key:         ${{ secrets.DEPLOY_SSH_KEY }}
          ssh-host:                ${{ secrets.DEPLOY_HOST }}
          ssh-user:                ${{ secrets.DEPLOY_USER }}
    
      - name: Deploy to server
        env:
          DEPLOY_USER: ${{secrets.DEPLOY_USER}}
          DEPLOY_HOST: ${{secrets.DEPLOY_HOST}}
          DEPLOY_SCRIPT: ${{secrets.DEPLOY_SCRIPT}}
        run: ssh "${DEPLOY_USER}@${DEPLOY_HOST}" "bash -s" < "~/deploy_scripts/${DEPLOY_SCRIPT}"