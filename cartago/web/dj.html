<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Lemniscata</title>
        <link type="text/css" rel="stylesheet" href="https://lemniscata.net/css/fonts.css"/>
        <link type="text/css" rel="stylesheet" href="https://lemniscata.net/css/main.css"/>
        <link type="text/css" rel="stylesheet" href="https://lemniscata.net/css/structure.css"/>
        <link type="text/css" rel="stylesheet" href="https://lemniscata.net/css/forms.css"/>
        <link type="text/css" rel="stylesheet" href="css/cartago.css"/>
        <link type="text/css" rel="stylesheet" href="css/dj.css"/>
    </head>
    <body>
        <div id="title-container">
            <a href="https://lemniscata.net/index">
                <div id="title-container">
                    <img src="https://lemniscata.net/resources/media/logo.gif">
                </div>
            </a>
        </div>
        <div id="content-container">
            <div id="left-content"></div>
            <div id="center-content">
                <div id="links">
                    <a href="cartago">Cartago</a>
                    <a href="dj">DJ</a>
                    <a href="https://lemniscata.net">Lemniscata</a>
                </div>
                <div id="content-windows" style="display: block;">
                    <div class="info-block">
                        <h1>Zona del DJ</h1>
                        <p>Pídele canciones chulas al DJ y podrás escucharlas en <a href="https://music.lemniscata.net">Lemniscata Music</a></p>
                    </div>
                    <div id="input-content">
                        <input name="url" type="text" required placeholder="URL de Youtube o Youtube Music">
                        <input id="add-to-queue-button" type="submit" value="Añadir a la cola">
                        <input id="submit-button" type="submit" value="Pedir música">
                        <span id="progress-info"></span>
                        <div id="queue">
                        </div>
                    </div>
                </div>
            </div>
            <div id="right-content"></div>
        </div>

        <script>
            const addToQueueButton = document.getElementById("add-to-queue-button");
            const queueContainer = document.getElementById("queue");

            addToQueueButton.addEventListener("click", (event) => {
                event.preventDefault();
                const urlInput = document.querySelector("input[name='url']");
                // can have multiple url separated by ";"
                const urls = urlInput.value.split(";").map(url => url.trim()).filter(url => url);
                for (const url of urls) {
                    const queueItem = document.createElement("span");
                    queueItem.className = "queue-item";
                    queueItem.textContent = url;
                    queueContainer.appendChild(queueItem);
                }
            });

            const requestDownload = async downloadUrl => {

                const infoElement = document.getElementById("progress-info");
                infoElement.innerHTML = "Procesando URL...";

                const response = await fetch("https://cartago.lemniscata.net/requestMusicDownload", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        url: downloadUrl
                    })
                })

                if (!response.ok) {
                    throw new Error("Error requesting music download: " + response.statusText);
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder();

                let buffer = '';

                while (true) {
                    const { value, done } = await reader.read();

                    buffer += decoder.decode(value || new Uint8Array(), {
                        stream: !done
                    });

                    const events = buffer.split('\n\n');
                    buffer = events.pop() ?? '';

                    for (const eventText of events) {
                        if (!eventText.trim()) continue;

                        let eventName = "message";
                        let dataText = "";

                        for (const line of eventText.split('\n')) {
                            if (line.startsWith('event:')) {
                                eventName = line.slice(6).trim();
                            } else if (line.startsWith('data:')) {
                                dataText += line.slice(5).trim();
                            }
                        }

                        if (!dataText) continue;

                        const data = JSON.parse(dataText);

                        if (eventName === "progress") {
                            infoElement.textContent = `Progreso: ${data.progress}/${data.total}`;
                        } else if (eventName === "error") {
                            console.error("Error from server:", data);
                            infoElement.textContent = `Error: ${data.errors.join(', ')}`;
                        } else if (eventName === "complete") {
                            console.log(
                                "Download complete:",
                                data.errors.length === 0
                                    ? "Completado !!"
                                    : "Completado con errores: " + data.errors.join(', ')
                            );

                            infoElement.textContent = data.errors.length === 0
                                ? "Completado !!"
                                : "Completado con errores: " + data.errors.join(', ');

                        }
                    }

                    if (done) {
                        break;
                    }
                }
            }

            const submitButton = document.getElementById("submit-button");
            submitButton.addEventListener("click", async (event) => {
                if (event.target.disabled) return; // Prevent multiple clicks
                submitButton.disabled = true;
                event.preventDefault();

                while (true) {
                    // get the first queue item
                    const firstQueueItem = queueContainer.querySelector(".queue-item");
                    if (!firstQueueItem) {
                        submitButton.disabled = false;
                        break;
                    }

                    const downloadUrl = firstQueueItem.textContent.trim();
                    try {
                        await requestDownload(downloadUrl);
                    } catch (error) {
                        console.error("Error during download request:", error);
                        document.getElementById("progress-info").innerHTML = "Error: " + error.message;
                        break; // Stop processing further if there's an error
                    }

                    // Remove the processed item from the queue
                    firstQueueItem.remove();
                
                }

                requestDownload().catch(error => {
                    console.error("Error during download request:", error);
                    document.getElementById("progress-info").innerHTML = "Error: " + error.message;
                });
            });
        </script>
    </body>
</html>
