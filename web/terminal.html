<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Terminal Lemniscata</title>
        <link type="text/css" rel="stylesheet" href="css/fonts.css"/>
        <link type="text/css" rel="stylesheet" href="css/structure.css"/>
        <link type="text/css" rel="stylesheet" href="css/main.css"/>
        <link type="text/css" rel="stylesheet" href="css/effects/misc_effects.css"/>
        <link type="text/css" rel="stylesheet" href="css/terminal.css"/>
    </head>
    <body>
        <a href="index">
            <div id="title-container" style="z-index: -10;">
                <img src="resources/media/logo.gif">
            </div>
        </a>
        <div id="content-container">
            <div id="left-content"></div>
            <div id="center-content">
                <div id="links">
                    <a href="index">Inicio</a>
                    <a href="museo">Museo</a>
                    <a href="info">Info</a>
                </div>
                <div id="content-windows">
                    <div id="terminal-wrapper">
                        <img id="terminal-cover" src="resources/media/terminal/pico8.png">
                        <div id="terminal-content"></div>
                    </div>
                </div>
                <div id="user-guide">
                    <span>Muévete con <b>[🢁]</b> y <b>[🢃]</b></span>
                    <span><b>[Intro]</b> para elegir</span>
                    <span><b>[Ctrl] + [q]</b>, o <b>[Esc]</b> para volver</span>
                </div>
            </div>
            <div id="right-content"></div>
        </div>

        <script src="scripts/terminal.js"></script>
    </body>
</html>
